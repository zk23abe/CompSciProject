{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠ Confirm Deletion</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to delete this item?</p>
                
                <h3 class="text-danger mb-4">{{ item }}</h3>
                
                <p class="text-muted small">This action cannot be undone.</p>

                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete It</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary w-100">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
