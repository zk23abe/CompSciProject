{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠ Confirm Deletion</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to delete this lesson?</p>
                
                <div class="alert alert-warning">
                    <strong>{{ item.subject }}</strong><br>
                    with {{ item.student }} on {{ item.lesson_date|date:"D d M, Y" }}
                </div>

                <p class="small text-muted">This action cannot be undone.</p>

                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete Lesson</button>
                    <a href="/" class="btn btn-outline-secondary w-100">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
